services:
  app:
    image: ghcr.io/authortom/skillslab:latest
    ports:
      - "3000:3000"
    environment:
      # Optional, and only read on the very first start: creates the first
      # administrator ("admin", or ADMIN_USERNAME) with this password, which
      # must be changed at first sign-in. Leave it unset to get a one-time
      # setup code in the log instead (docker compose logs app).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      # Optional: defaults are 8 hours idle and 12 hours after signing in.
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-}
    volumes:
      - clinical-data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  clinical-data:
