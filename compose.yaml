services:
  app:
    image: ghcr.io/authortom/skillslab:latest
    ports:
      - "3000:3000"
    environment:
      # Required — the server will not start without a real password.
      # Set it in .env beside this file, or pass ADMIN_PASSWORD=... on the command line.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env or on the command line}
    volumes:
      - clinical-data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  clinical-data:
