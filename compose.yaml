services:
  app:
    # The release to run, from SKILLSLAB_VERSION in .env (e.g. 1.0.0 for the
    # git tag v1.0.0). Pinned so an upgrade only happens when you choose: see
    # "Upgrading" in the README.
    image: ghcr.io/authortom/skillslab:${SKILLSLAB_VERSION:?Set SKILLSLAB_VERSION in .env to the release to run, e.g. 1.0.0}
    # Not published on the host: everything goes through Caddy below, which
    # terminates HTTPS. The app is reachable only on the compose network.
    expose:
      - "3000"
    environment:
      # Optional, and only read on the very first start: creates the first
      # administrator ("admin", or ADMIN_USERNAME) with this password, which
      # must be changed at first sign-in. Leave it unset to get a one-time
      # setup code in the log instead (docker compose logs app).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      # Optional: defaults are 8 hours idle and 12 hours after signing in.
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-}
      # Optional: how many backup snapshots to keep (default 14).
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      # Optional but recommended: an Ed25519 private key (PEM) to sign every
      # offline release with, e.g. /run/secrets/skillslab/release-signing-key.pem.
      # See "Release signing" in the README.
      RELEASE_SIGNING_KEY_FILE: ${RELEASE_SIGNING_KEY_FILE:-}
    volumes:
      - clinical-data:/app/data
      # Snapshots from `docker compose exec app node scripts/backup.mjs`. A
      # named volume by default; set SKILLSLAB_BACKUP_PATH to a host folder
      # (ideally a mounted network share) to keep them off this server's disk.
      - ${SKILLSLAB_BACKUP_PATH:-skillslab-backups}:/backups
      # Secrets such as the release signing key, read-only.
      - ${SKILLSLAB_SECRETS_DIR:-./secrets}:/run/secrets/skillslab:ro
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Takes a snapshot every night (BACKUP_TIME, default 02:00 in TZ, default
  # UTC) with scripts/backup.mjs, which is safe while the app is serving. Same
  # image, data and backup folder as the app. See "Backing up and restoring"
  # in the README.
  backups:
    image: ghcr.io/authortom/skillslab:${SKILLSLAB_VERSION:?Set SKILLSLAB_VERSION in .env to the release to run, e.g. 1.0.0}
    command: ["node", "scripts/backup-daily.mjs"]
    environment:
      BACKUP_TIME: ${BACKUP_TIME:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      TZ: ${TZ:-}
    volumes:
      - clinical-data:/app/data
      - ${SKILLSLAB_BACKUP_PATH:-skillslab-backups}:/backups
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    init: true

  # Terminates HTTPS for SKILLSLAB_HOSTNAME and proxies to the app. Caddy sets
  # X-Forwarded-For (the client's address, which login throttling and the
  # audit log read) and X-Forwarded-Proto: https (which makes the session
  # cookie Secure). See "Internal deployment with HTTPS" in the README.
  caddy:
    image: caddy:2.11-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTPS_PORT:-443}:443"
      # Only redirects to HTTPS.
      - "${HTTP_PORT:-80}:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # Certificates from your organisation's CA, when SKILLSLAB_TLS names them.
      - ${SKILLSLAB_CERTS_DIR:-./certs}:/certs:ro
      # Caddy's state. With SKILLSLAB_TLS=internal this holds the root
      # certificate devices are told to trust: keep the volume, and back it up.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

configs:
  caddyfile:
    # Compose fills in the ${...} values from .env when the stack starts.
    content: |
      {
        # Caddy's internal CA is handed to devices by hand or by MDM; there is
        # no point installing it in the container's own trust store.
        skip_install_trust
      }

      ${SKILLSLAB_HOSTNAME:-skillslab.localhost} {
        # "internal" (Caddy's own CA), or "<cert file> <key file>" under /certs.
        tls ${SKILLSLAB_TLS:-internal}
        header Strict-Transport-Security "max-age=31536000"
        reverse_proxy app:3000
      }

volumes:
  clinical-data:
  skillslab-backups:
  caddy-data:
  caddy-config:
